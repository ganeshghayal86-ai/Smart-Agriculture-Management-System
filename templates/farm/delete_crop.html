<!DOCTYPE html>
<html>
<head>
    <title>Delete Crop</title>
</head>
<body>

    <h2>Delete Crop</h2>

    <p>Are you sure you want to delete "{{ crop.crop_name }}"?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'view_crops' %}">
        <button type="button">Cancel</button>
    </a>

</body>
</html>
