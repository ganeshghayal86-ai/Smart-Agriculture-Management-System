
{% extends 'base.html' %}

{% block content %}

<style>
.delete-container {
    max-width: 500px;
    margin: 70px auto;
    padding: 35px;
    background: white;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.delete-container h2 {
    color: #dc2626;
    margin-bottom: 20px;
}

.delete-container p {
    color: #374151;
    font-size: 16px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
}

.cancel-btn {
    display: inline-block;
    margin-left: 10px;
    padding: 12px 25px;
    background: #e5e7eb;
    color: #111827;
    border-radius: 8px;
    text-decoration: none;
}
</style>

<div class="delete-container">

    <h2>🗑️ Delete Transaction</h2>

    <p>Are you sure you want to delete this transaction?</p>

    <p><strong>{{ transaction.title }}</strong></p>
    <p>Amount: ₹{{ transaction.amount }}</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>

        <a href="{% url 'finance_dashboard' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
